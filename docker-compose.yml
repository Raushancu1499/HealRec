version: '3.9'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7-jammy
    container_name: healrec-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: healrec
    networks:
      - healrec-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/healrec --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: healrec-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/healrec
      JWT_SECRET: healrec_secret_key_2024_change_in_production
      JWT_EXPIRE: 7d
      BCRYPT_SALT_ROUNDS: 12
      FRONTEND_URL: http://localhost:5173
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - healrec-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/status', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (for Docker-only mode)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:5000/api
    container_name: healrec-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - healrec-network

volumes:
  mongodb_data:
    driver: local

networks:
  healrec-network:
    driver: bridge
