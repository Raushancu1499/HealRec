<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8">
    <title>Login and Registration Form in HTML & CSS | CodingLab</title>
    <link rel="stylesheet" href="hr1.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
      function validateLogin(form) {
        const allowedUsers = ["pushkarjassal@gmail.com", "Pushkar Jassal"];
        const emailOrUsername = form.querySelector('input[type="text"]').value;
        if (allowedUsers.includes(emailOrUsername)) {
          window.location.href = 'i2.html';
        } else {
          alert("Access Denied");
        }
        return false; // Prevent form submission
      }
    </script>
  </head>
  <body>
    <div class="container">
      <input type="checkbox" id="flip">
      <div class="cover">
        <div class="front">
          <img src="c:\Users\pushk\OneDrive\Desktop\WhatsApp Image 2024-09-02 at 11.31.16_fbba8845.jpg" alt="">
        </div>
        <div class="back">
          <img class="backImg" src="c:\Users\pushk\OneDrive\Desktop\WhatsApp Image 2024-09-02 at 11.31.16_fbba8845.jpg" alt="">
        </div>
      </div>
      <div class="forms">
        <div class="form-content">
          <div class="login-form">
            <div class="title">Client Login</div>
            <form onsubmit="return validateLogin(this);">
              <div class="input-boxes">
                <div class="input-box">
                  <i class="fas fa-envelope"></i>
                  <input type="text" placeholder="Enter your email or username" required>
                </div>
                <div class="input-box">
                  <i class="fas fa-lock"></i>
                  <input type="password" placeholder="Enter your password" required>
                </div>
                <div class="text"><a href="#">Forgot password?</a></div>
                <div class="button input-box">
                  <button class="submit" type="submit">Submit</button>
                </div>
                <div class="text sign-up-text"><label for="flip">Login as Doctor</label></div>
              </div>
              <div class="text sign-up-text">Don't have an account? <a href="healreclogin.html">Sign up</a></div>
            </form>
          </div>
          <div class="signup-form">
            <div class="title">Doctor Login</div>
            <form onsubmit="return validateLogin(this);">
              <div class="input-boxes">
                <div class="input-box">
                  <i class="fas fa-envelope"></i>
                  <input type="text" placeholder="Enter your email or username" required>
                </div>
                <div class="input-box">
                  <i class="fas fa-lock"></i>
                  <input type="password" placeholder="Enter your password" required>
                </div>
                <div class="text"><a href="#">Forgot password?</a></div>
                <div class="button input-box">
                  <button class="submit" type="submit">Submit</button>
                </div>
                <div class="text sign-up-text"><label for="flip">Login as Client</label></div>
              </div>
              <div class="text sign-up-text">Don't have an account? <a href="healreclogin.html">Sign up</a></div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
