<!DOCTYPE html>
<html lang="en">
    <article class="leaderboard">
    <header>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>HealRec</title>
        <link rel="stylesheet" href="patient.css">
<div class="container">
	<div class="screen">
		<div class="screen__content">
			<form class="login">
				<h2>Add Details For New Patient</h2>
				<div class="login__field">
					<label for="login__icon fas fa-user">Patient Id:</label>
					<i class="login__icon fas fa-user"></i>
					<input type="text" class="login__input" placeholder="User name / Email of Client">
				</div>
				<div class="login__field">
					<label for="login__icon fas fa-calendar">First Visit:</label>
					<i class="login__icon fas fa-calendar"></i>
					<input type="date" class="login__input" placeholder="Date of Birth">
				</div>
                
				<button class="button login__submit" type="button" onclick="window.location.href = 'doc.html'">
					<span class="button__text">Add Profile</span>
					<i class="button__icon fas fa-chevron-right"></i>
				</button>
				
				<button class="button login__submit" type="button" onclick="window.location.href = 'doc.html'">
					<span class="button__text">Cancel</span>
					<i class="button__icon fas fa-chevron-right"></i>
				</button>
			</form>
			</div>
		</div>
		<div class="screen__background">
			<span class="screen__background__shape screen__background__shape4"></span>
			<span class="screen__background__shape screen__background__shape3"></span>		
			<span class="screen__background__shape screen__background__shape2"></span>
			<span class="screen__background__shape screen__background__shape1"></span>
		</div>		
	</div>
</div>
