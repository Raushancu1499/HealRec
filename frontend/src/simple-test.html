<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealRec Simple Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }
        #status {
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            background: white;
        }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>HealRec Diagnostic Test</h1>
    <div id="status"></div>
    
    <script>
        console.log('Starting diagnostic test...');
        
        // Test basic JavaScript functionality
        try {
            document.getElementById('status').innerHTML = '<div class="success">✅ JavaScript Working</div>';
            console.log('✅ Basic JavaScript test passed');
        } catch (e) {
            document.getElementById('status').innerHTML = '<div class="error">❌ JavaScript Error: ' + e.message + '</div>';
            console.error('❌ JavaScript test failed:', e);
        }
        
        // Test for React
        setTimeout(() => {
            if (typeof React !== 'undefined') {
                document.getElementById('status').innerHTML += '<div class="success">✅ React Library Available</div>';
                console.log('✅ React test passed');
            } else {
                document.getElementById('status').innerHTML += '<div class="error">❌ React Library Not Available</div>';
                console.error('❌ React test failed');
            }
        }, 100);
        
        // Test for Socket.IO
        setTimeout(() => {
            if (typeof io !== 'undefined') {
                document.getElementById('status').innerHTML += '<div class="success">✅ Socket.IO Library Available</div>';
                console.log('✅ Socket.IO test passed');
            } else {
                document.getElementById('status').innerHTML += '<div class="error">❌ Socket.IO Library Not Available</div>';
                console.error('❌ Socket.IO test failed');
            }
        }, 200);
        
        // Final result
        setTimeout(() => {
            const statusDiv = document.getElementById('status');
            const hasErrors = statusDiv.innerHTML.includes('error');
            
            if (hasErrors) {
                statusDiv.style.background = '#ffebee';
                statusDiv.innerHTML += '<div style="margin-top: 10px; padding: 10px; background: red; color: white; border-radius: 5px;"><strong>❌ ISSUES DETECTED</strong><br>Please check browser console for details.</div>';
            } else {
                statusDiv.style.background = '#d4edda';
                statusDiv.innerHTML += '<div style="margin-top: 10px; padding: 10px; background: green; color: white; border-radius: 5px;"><strong>✅ ALL TESTS PASSED</strong><br>The HealRec platform should work properly.</div>';
            }
        }, 300);
    </script>
</body>
</html>
