<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealRec Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-result {
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            background: white;
        }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>HealRec Test Page</h1>
    <div id="test-result"></div>
    
    <script>
        console.log('Starting JavaScript tests...');
        
        // Test 1: Basic DOM manipulation
        try {
            document.getElementById('test-result').innerHTML = '<div class="success">✅ DOM manipulation works</div>';
            console.log('✅ Test 1 passed: DOM manipulation');
        } catch (e) {
            document.getElementById('test-result').innerHTML = '<div class="error">❌ Test 1 failed: ' + e.message + '</div>';
            console.error('❌ Test 1 failed:', e);
        }
        
        // Test 2: Check for window objects
        if (typeof window !== 'undefined') {
            document.getElementById('test-result').innerHTML += '<div class="success">✅ Window object available</div>';
            console.log('✅ Test 2 passed: Window object available');
        } else {
            document.getElementById('test-result').innerHTML += '<div class="error">❌ Test 2 failed: Window object not available</div>';
            console.error('❌ Test 2 failed: Window object not available');
        }
        
        // Test 3: Check for React
        setTimeout(() => {
            if (typeof React !== 'undefined') {
                document.getElementById('test-result').innerHTML += '<div class="success">✅ React available</div>';
                console.log('✅ Test 3 passed: React available');
            } else {
                document.getElementById('test-result').innerHTML += '<div class="error">❌ Test 3 failed: React not available</div>';
                console.error('❌ Test 3 failed: React not available');
            }
        }, 100);
        
        // Test 4: Check for Socket.IO
        if (typeof io !== 'undefined') {
            document.getElementById('test-result').innerHTML += '<div class="success">✅ Socket.IO available</div>';
            console.log('✅ Test 4 passed: Socket.IO available');
        } else {
            document.getElementById('test-result').innerHTML += '<div class="error">❌ Test 4 failed: Socket.IO not available</div>';
            console.error('❌ Test 4 failed: Socket.IO not available');
        }
    </script>
</body>
</html>
